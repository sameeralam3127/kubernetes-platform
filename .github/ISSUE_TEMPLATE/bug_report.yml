name: 🐛 Bug report
description: Something in the platform does not behave as documented
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check [ROADMAP.md](../blob/main/ROADMAP.md). If the capability
        belongs to a phase that has not landed, it is not a bug — it is not built yet.

        **Security issues do not go here.** See [SECURITY.md](../blob/main/SECURITY.md).

  - type: input
    id: phase
    attributes:
      label: Affected phase / component
      placeholder: "Phase 1 — scripts/cluster-up.sh"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Quote the doc or README line that led you to expect it, if there is one.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include the full error output, not a summary of it.
      render: console
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make down-force
        2. make up
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Output of: `make preflight` and `uname -sm`"
      render: console
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Workarounds you found, or what you had already tried.
