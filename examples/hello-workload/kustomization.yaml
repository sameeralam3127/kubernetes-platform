---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied into dev, the only namespace where a developer has write access.
namespace: dev

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - includeSelectors: false
    pairs:
      platform.local/example: hello-workload
