# Refused at admission by the dev LimitRange: 3 CPU exceeds max.cpu of 1.
#
# Expected:
#   Error from server (Forbidden): pods "oversized" is forbidden:
#   maximum cpu usage per Container is 1, but limit is 3
---
apiVersion: v1
kind: Pod
metadata:
  name: oversized
  namespace: dev
  labels:
    app.kubernetes.io/name: oversized
    app.kubernetes.io/part-of: kubernetes-platform
    platform.local/example: quota-limits
spec:
  restartPolicy: Never
  containers:
    - name: greedy
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: "3"
          memory: 2Gi
        limits:
          cpu: "3"
          memory: 2Gi
