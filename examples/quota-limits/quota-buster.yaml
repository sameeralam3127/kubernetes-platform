# Each replica is individually legal; ten of them exceed the namespace quota.
#
# The Deployment is accepted and the ReplicaSet controller then fails to create
# pods once requests.cpu is exhausted. The failure surfaces in ReplicaSet
# events, not in the apply — which is why `kubectl get deploy` showing 0/10
# needs `describe replicaset` to explain itself.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-buster
  namespace: dev
  labels:
    app.kubernetes.io/name: quota-buster
    app.kubernetes.io/part-of: kubernetes-platform
    platform.local/example: quota-limits
spec:
  replicas: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: quota-buster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quota-buster
        app.kubernetes.io/part-of: kubernetes-platform
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 400m      # legal alone; 10 x 400m = 4 CPU vs a 2 CPU quota
              memory: 64Mi
            limits:
              cpu: 800m
              memory: 128Mi
