# Local certificate issuers.
#
# `selfsigned` issues certificates signed by nothing — browsers will warn, and
# that is fine, because what is being demonstrated is the *lifecycle*: a
# Certificate resource, a Secret populated by cert-manager, automatic renewal,
# and an alert when renewal fails (Phase 7). None of that needs a public CA.
#
# `platform-ca` builds a small CA on top of it so that certificates issued to
# workloads share a trust root, which is what a real internal PKI looks like.
# Phase 10 replaces both with an ACME issuer using DNS-01.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  labels:
    app.kubernetes.io/name: selfsigned
    app.kubernetes.io/component: pki
    app.kubernetes.io/part-of: kubernetes-platform
spec:
  selfSigned: {}
---
# Root certificate for the local CA, signed by the self-signed issuer above.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-ca
  namespace: platform-system
  labels:
    app.kubernetes.io/name: platform-ca
    app.kubernetes.io/component: pki
    app.kubernetes.io/part-of: kubernetes-platform
spec:
  isCA: true
  commonName: kubernetes-platform-local-ca
  secretName: platform-ca-key-pair
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days — renewal failure has a month of runway to alert on
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# The issuer workloads actually use. Certificates from here chain to a common
# root, so trusting one certificate trusts the platform.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-ca
  labels:
    app.kubernetes.io/name: platform-ca
    app.kubernetes.io/component: pki
    app.kubernetes.io/part-of: kubernetes-platform
spec:
  ca:
    secretName: platform-ca-key-pair
