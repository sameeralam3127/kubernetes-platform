# Identities for the platform's personas.
#
# ONE ServiceAccount per persona, bound into several namespaces with different
# Roles — not one ServiceAccount per namespace.
#
# This matters. A `developer` account in each of dev/staging/prod would be three
# unrelated identities that happen to share a name, and "the developer can write
# to dev but only read prod" would not be a true statement about anybody. The
# model here is one person whose authority varies by environment, which is what
# the RoleBindings express.
#
# They live in platform-system because a persona is not a workload — it belongs
# to no single environment, and putting it in `dev` would imply otherwise.
#
# ServiceAccounts are used because a kind cluster has no OIDC provider, and they
# are the only identity Kubernetes issues itself. In Phase 10 these subjects
# become OIDC groups; the Roles and bindings do not change.
#
# `automountServiceAccountToken: false`: these are identities for humans and
# pipelines using kubectl, not for pods. Nothing should silently mount them.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer
  namespace: platform-system
  labels:
    app.kubernetes.io/name: developer
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: kubernetes-platform
  annotations:
    platform.local/persona: >-
      Application developer. Writes to dev and staging, reads prod,
      execs in dev only. Stands in for the OIDC group platform:developers.
automountServiceAccountToken: false
---
# The CI identity. Deliberately the most restricted thing in the platform: a
# build runner's credentials are the most valuable to steal, so they carry the
# least authority. Writes to dev only — from Phase 6, staging and prod are
# reached by committing to Git, not by pushing from a pipeline.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: platform-system
  labels:
    app.kubernetes.io/name: ci-deployer
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: kubernetes-platform
  annotations:
    platform.local/persona: >-
      CI pipeline. Deploys to dev only. No secrets, no delete, no exec.
automountServiceAccountToken: false
